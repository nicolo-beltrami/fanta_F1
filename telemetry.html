<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telemetry Center - Paddock Fantasy</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #161b22;
      --accent-red: #e10600;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --neon-glow: rgba(225, 6, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 2px solid var(--accent-red);
      margin-bottom: 25px;
    }

    .back-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: bold;
      transition: color 0.2s;
    }

    .back-btn:hover { color: var(--accent-red); }

    .telemetry-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h2 { color: var(--accent-red); font-size: 1.1rem; margin-bottom: 15px; text-transform: uppercase; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
    
    select, input, button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #fff;
      font-size: 0.95rem;
    }

    button.btn-red {
      background: var(--accent-red);
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button.btn-red:hover { opacity: 0.9; }

    button.btn-api {
      background: #238636;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      transition: opacity 0.2s, background 0.2s;
    }

    button.btn-api:disabled {
      background: #21262d;
      color: #8b949e;
      cursor: not-allowed;
      border: 1px solid #30363d;
    }

    .status-msg {
      font-size: 0.8rem;
      margin-bottom: 15px;
      padding: 8px;
      border-radius: 6px;
      display: none;
    }

    .status-warning { background: rgba(210, 153, 34, 0.15); color: #d29922; border: 1px solid #d29922; }
    .status-success { background: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid #2ea043; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #30363d; font-size: 0.9rem; }
    th { color: var(--text-muted); text-transform: uppercase; }

    .badge-pts {
      background: rgba(35, 134, 54, 0.2);
      color: #2ea043;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .telemetry-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">← Torna al Paddock</a>
    <h1 style="font-size: 1.4rem;">📊 TELEMETRY CENTER</h1>
  </header>

  <div class="telemetry-grid">
    
    <!-- SINISTRA: SYNC API E FORM -->
    <div class="panel">
      <h2>Sincronizzazione GP</h2>

      <div class="form-group">
        <label>Seleziona Gara da Sincronizzare</label>
        <select id="race-round" onchange="checkRaceAvailability()">
          <option value="last">Ultima Gara Disputata</option>
          <option value="1">Round 1 - GP Australia</option>
          <option value="2">Round 2 - GP Cina</option>
          <option value="3">Round 3 - GP Giappone</option>
          <option value="4">Round 4 - GP Bahrain</option>
          <option value="5">Round 5 - GP Arabia Saudita</option>
        </select>
      </div>

      <button class="btn-api" id="fetch-btn" onclick="fetchF1Results()">⚡ Scarica Risultati Reali F1</button>
      <div id="status-box" class="status-msg"></div>
      
      <hr style="border-color: #30363d; margin: 15px 0;">

      <h2>Dati Weekend</h2>
      
      <div class="form-group">
        <label>🥇 1° Classificato (25 PTS)</label>
        <input type="text" id="p1-winner" placeholder="In attesa di sincronizzazione..." readonly>
      </div>

      <div class="form-group">
        <label>🥈 2° Classificato (18 PTS)</label>
        <input type="text" id="p2-winner" placeholder="In attesa di sincronizzazione..." readonly>
      </div>

      <div class="form-group">
        <label>🥉 3° Classificato (15 PTS)</label>
        <input type="text" id="p3-winner" placeholder="In attesa di sincronizzazione..." readonly>
      </div>

      <div class="form-group">
        <label>⚡ Giro Veloce (+3 PTS)</label>
        <input type="text" id="fastest-lap" placeholder="In attesa di sincronizzazione..." readonly>
      </div>

      <div class="form-group">
        <label>🛞 Mescola Vincente GP (Strategia Gomme)</label>
        <select id="winning-tyre">
          <option value="Soft">🔴 Soft</option>
          <option value="Medium" selected>🟡 Medium</option>
          <option value="Hard">⚪ Hard</option>
        </select>
      </div>

      <button class="btn-red" id="calc-btn" onclick="calculateScores()" disabled>Calcola Punteggi Lega</button>
    </div>

    <!-- DESTRA: CLASSIFICA LEGA -->
    <div class="panel">
      <h2>🏆 Classifica Generale Fanta F1</h2>
      <table>
        <thead>
          <tr>
            <th>Pos.</th>
            <th>Fantamanager</th>
            <th>Punti Totali</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          <!-- Generato via JS -->
        </tbody>
      </table>
    </div>

  </div>

  <script src="calendar.js"></script>
  <script>
    let auctionData = JSON.parse(localStorage.getItem('fantaF1_auction')) || { players: {} };
    let leaderboard = JSON.parse(localStorage.getItem('fantaF1_leaderboard')) || {};

    function init() {
      renderLeaderboard();
      checkRaceAvailability();
    }

    function checkRaceAvailability() {
      const selectedRound = document.getElementById('race-round').value;
      const btn = document.getElementById('fetch-btn');
      const statusBox = document.getElementById('status-box');

      statusBox.style.display = 'none';

      if (selectedRound === 'last') {
        btn.disabled = false;
        return;
      }

      const raceIndex = parseInt(selectedRound) - 1;
      if (typeof f1Calendar !== 'undefined' && f1Calendar[raceIndex]) {
        const raceDate = new Date(f1Calendar[raceIndex].date);
        // Stima fine gara: 3 ore dopo l'orario di partenza ufficiale
        const raceEndEstimated = new Date(raceDate.getTime() + (3 * 60 * 60 * 1000));
        const now = new Date();

        if (now < raceEndEstimated) {
          btn.disabled = true;
          statusBox.className = "status-msg status-warning";
          statusBox.innerText = `⏳ Gara non ancora conclusa! Il download sarà disponibile il ${raceDate.toLocaleDateString('it-IT')} dopo il termine della corsa.`;
          statusBox.style.display = 'block';
        } else {
          btn.disabled = false;
        }
      }
    }

    async function fetchF1Results() {
      const btn = document.getElementById('fetch-btn');
      const calcBtn = document.getElementById('calc-btn');
      const round = document.getElementById('race-round').value;
      const statusBox = document.getElementById('status-box');

      btn.innerText = "⏳ Verifico esito su API ufficiali...";
      btn.disabled = true;

      try {
        const response = await fetch(`https://api.jolpica.net/ergast/f1/2026/${round}/results.json`);
        const data = await response.json();

        const raceData = data.MRData.RaceTable.Races[0];

        if (!raceData || !raceData.Results || raceData.Results.length === 0) {
          statusBox.className = "status-msg status-warning";
          statusBox.innerText = "⚠️ La gara non è ancora stata completata o i dati ufficiali non sono stati ancora pubblicati.";
          statusBox.style.display = 'block';
          btn.innerText = "⚡ Scarica Risultati Reali F1";
          btn.disabled = false;
          return;
        }

        const results = raceData.Results;

        const p1 = `${results[0].Driver.givenName} ${results[0].Driver.familyName}`;
        const p2 = `${results[1].Driver.givenName} ${results[1].Driver.familyName}`;
        const p3 = `${results[2].Driver.givenName} ${results[2].Driver.familyName}`;

        const fastLapDriver = results.find(r => r.FastestLap && r.FastestLap.rank === "1");
        const fastLapName = fastLapDriver ? `${fastLapDriver.Driver.givenName} ${fastLapDriver.Driver.familyName}` : p1;

        document.getElementById('p1-winner').value = p1;
        document.getElementById('p2-winner').value = p2;
        document.getElementById('p3-winner').value = p3;
        document.getElementById('fastest-lap').value = fastLapName;

        statusBox.className = "status-msg status-success";
        statusBox.innerText = `✅ Risultati del ${raceData.raceName} acquisiti con successo! Premi "Calcola Punteggi" per aggiornare la lega.`;
        statusBox.style.display = 'block';

        calcBtn.disabled = false;

      } catch (error) {
        console.error("Errore API:", error);
        statusBox.className = "status-msg status-warning";
        statusBox.innerText = "❌ Impossibile connettersi ai server F1 o gara non ancora ufficiale.";
        statusBox.style.display = 'block';
      } finally {
        btn.innerText = "⚡ Scarica Risultati Reali F1";
        btn.disabled = false;
      }
    }

    function calculateScores() {
      const p1 = document.getElementById('p1-winner').value.trim();
      const p2 = document.getElementById('p2-winner').value.trim();
      const p3 = document.getElementById('p3-winner').value.trim();
      const fastLap = document.getElementById('fastest-lap').value.trim();
      const winningTyre = document.getElementById('winning-tyre').value;

      if (!p1 || !p2 || !p3) {
        alert("Scarica i dati del GP prima di procedere con il calcolo!");
        return;
      }

      const players = Object.keys(auctionData.players);

      players.forEach(name => {
        let currentScore = leaderboard[name] || 0;
        let roundScore = 0;

        const lineup = JSON.parse(localStorage.getItem(`fantaF1_lineup_${name}`));
        const roster = auctionData.players[name].roster.map(r => r.split(' (')[0]);

        if (roster.length > 0) {
          if (roster.some(item => p1.includes(item) || item.includes(p1))) roundScore += 25;
          if (roster.some(item => p2.includes(item) || item.includes(p2))) roundScore += 18;
          if (roster.some(item => p3.includes(item) || item.includes(p3))) roundScore += 15;

          if (roster.some(item => fastLap.includes(item) || item.includes(fastLap))) roundScore += 3;

          if (lineup && lineup.tyre === winningTyre) {
            roundScore += 5;
          }
        }

        leaderboard[name] = currentScore + roundScore;
      });

      localStorage.setItem('fantaF1_leaderboard', JSON.stringify(leaderboard));
      alert("Punteggi aggiornati con successo nella classifica generale!");
      renderLeaderboard();
    }

    function renderLeaderboard() {
      const tbody = document.getElementById('leaderboard-body');
      const players = Object.keys(auctionData.players);

      if (players.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="color: var(--text-muted);">Nessun fantamanager presente. Registrali nell\'Asta Room.</td></tr>';
        return;
      }

      const sorted = players.sort((a, b) => (leaderboard[b] || 0) - (leaderboard[a] || 0));

      tbody.innerHTML = sorted.map((name, index) => `
        <tr>
          <td><strong>#${index + 1}</strong></td>
          <td>${name}</td>
          <td><span class="badge-pts">${leaderboard[name] || 0} PTS</span></td>
        </tr>
      `).join('');
    }

    init();
  </script>
</body>
</html>
