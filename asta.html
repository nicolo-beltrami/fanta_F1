<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asta Room - Paddock Fantasy</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #161b22;
      --accent-red: #e10600;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --neon-glow: rgba(225, 6, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 2px solid var(--accent-red);
      margin-bottom: 25px;
    }

    .back-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: bold;
      transition: color 0.2s;
    }

    .back-btn:hover { color: var(--accent-red); }

    .auction-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h2 { color: var(--accent-red); font-size: 1.1rem; margin-bottom: 15px; text-transform: uppercase; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
    
    select, input, button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #fff;
      font-size: 0.95rem;
    }

    button { cursor: pointer; font-weight: bold; transition: background 0.2s; }

    .btn-red { background: var(--accent-red); border: none; }
    .btn-red:hover { opacity: 0.9; }

    .btn-secondary { background: #21262d; border: 1px solid #30363d; margin-top: 5px; }
    .btn-secondary:hover { background: #30363d; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #30363d; font-size: 0.85rem; }
    th { color: var(--text-muted); text-transform: uppercase; }

    .badge-credits {
      background: rgba(225, 6, 0, 0.2);
      color: var(--accent-red);
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    .roster-list { font-size: 0.8rem; color: #c9d1d9; }
    .roster-item { display: inline-block; background: #0d1117; padding: 2px 6px; border-radius: 4px; margin: 2px; }

    @media (max-width: 768px) {
      .auction-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">← Torna al Paddock</a>
    <h1 style="font-size: 1.4rem;">🔨 ASTA ROOM LIVE</h1>
  </header>

  <div class="auction-grid">
    
    <!-- COLONNA DI SINISTRA: CONFIGURAZIONE & AGGIUDICAZIONE -->
    <div>
      <!-- CONFIGURAZIONE PARTECIPANTI -->
      <div class="panel">
        <h2>1. Gestione Partecipanti</h2>
        <div class="form-group">
          <label>Aggiungi Fantamanager</label>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="player-name" placeholder="Nome amico">
            <button class="btn-secondary" style="width: 100px;" onclick="addPlayer()">Aggiungi</button>
          </div>
        </div>
      </div>

      <!-- FORM BATTUTA D'ASTA -->
      <div class="panel">
        <h2>2. Registra Aggiudicazione</h2>
        
        <div class="form-group">
          <label>Seleziona Fantamanager</label>
          <select id="player-select"></select>
        </div>

        <div class="form-group">
          <label>Pilota o Scuderia</label>
          <select id="item-select">
            <optgroup label="── PILOTI ──">
              <option value="Max Verstappen">Max Verstappen (Red Bull)</option>
              <option value="Liam Lawson">Liam Lawson (Red Bull)</option>
              <option value="Lewis Hamilton">Lewis Hamilton (Ferrari)</option>
              <option value="Charles Leclerc">Charles Leclerc (Ferrari)</option>
              <option value="Lando Norris">Lando Norris (McLaren)</option>
              <option value="Oscar Piastri">Oscar Piastri (McLaren)</option>
              <option value="George Russell">George Russell (Mercedes)</option>
              <option value="Kimi Antonelli">Kimi Antonelli (Mercedes)</option>
              <option value="Fernando Alonso">Fernando Alonso (Aston Martin)</option>
              <option value="Lance Stroll">Lance Stroll (Aston Martin)</option>
              <option value="Pierre Gasly">Pierre Gasly (Alpine)</option>
              <option value="Jack Doohan">Jack Doohan (Alpine)</option>
              <option value="Alexander Albon">Alexander Albon (Williams)</option>
              <option value="Carlos Sainz">Carlos Sainz (Williams)</option>
              <option value="Yuki Tsunoda">Yuki Tsunoda (RB)</option>
              <option value="Isack Hadjar">Isack Hadjar (RB)</option>
              <option value="Nico Hulkenberg">Nico Hulkenberg (Sauber)</option>
              <option value="Gabriel Bortoleto">Gabriel Bortoleto (Sauber)</option>
              <option value="Esteban Ocon">Esteban Ocon (Haas)</option>
              <option value="Oliver Bearman">Oliver Bearman (Haas)</option>
            </optgroup>
            <optgroup label="── SCUDERIE / COSTRUTTORI ──">
              <option value="Scuderia Ferrari">Scuderia Ferrari</option>
              <option value="Red Bull Racing">Red Bull Racing</option>
              <option value="McLaren">McLaren</option>
              <option value="Mercedes">Mercedes</option>
              <option value="Aston Martin">Aston Martin</option>
              <option value="Alpine">Alpine</option>
              <option value="Williams">Williams</option>
              <option value="RB">RB</option>
              <option value="Sauber">Sauber</option>
              <option value="Haas">Haas</option>
            </optgroup>
          </select>
        </div>

        <div class="form-group">
          <label>Prezzo (M$)</label>
          <input type="number" id="price-input" placeholder="Es. 120" min="1">
        </div>

        <button class="btn-red" onclick="confirmPurchase()">Assegna Acquisto</button>
        <button class="btn-secondary" onclick="resetAuction()" style="margin-top: 15px; color: #f85149;">Azzera Asta</button>
      </div>
    </div>

    <!-- COLONNA DI DESTRA: TABELLONE LEGA -->
    <div class="panel">
      <h2>3. Tabellone Rose & Crediti</h2>
      <table>
        <thead>
          <tr>
            <th>Fantamanager</th>
            <th>Budget Rimanente</th>
            <th>Rosa (Max 4 slot)</th>
          </tr>
        </thead>
        <tbody id="league-table-body">
          <!-- Generato via JS -->
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // Inizializzazione Dati senza utenti preimpostati
    let leagueData = JSON.parse(localStorage.getItem('fantaF1_auction')) || { players: {} };

    function saveState() {
      localStorage.setItem('fantaF1_auction', JSON.stringify(leagueData));
      render();
    }

    function addPlayer() {
      const nameInput = document.getElementById('player-name');
      const name = nameInput.value.trim();
      if (!name) return;
      if (leagueData.players[name]) {
        alert("Giocatore già presente!");
        return;
      }
      leagueData.players[name] = { budget: 500, roster: [] };
      nameInput.value = '';
      saveState();
    }

    function confirmPurchase() {
      const player = document.getElementById('player-select').value;
      const item = document.getElementById('item-select').value;
      const price = parseInt(document.getElementById('price-input').value);

      if (!player) { alert("Aggiungi e seleziona prima un fantamanager!"); return; }
      if (!price || price <= 0) { alert("Inserisci un prezzo valido!"); return; }

      const targetPlayer = leagueData.players[player];

      if (targetPlayer.budget < price) {
        alert("Crediti insufficienti per questo acquisto!");
        return;
      }

      if (targetPlayer.roster.length >= 4) {
        alert("Rosa completa! Massimo 4 elementi (3 Piloti + 1 Scuderia).");
        return;
      }

      targetPlayer.budget -= price;
      targetPlayer.roster.push(`${item} (${price}M$)`);
      document.getElementById('price-input').value = '';
      
      saveState();
    }

    function resetAuction() {
      if (confirm("Vuoi davvero azzerare l'asta e cancellare i dati?")) {
        localStorage.removeItem('fantaF1_auction');
        leagueData = { players: {} };
        render();
      }
    }

    function render() {
      const playerSelect = document.getElementById('player-select');
      const playerNames = Object.keys(leagueData.players);
      
      if (playerNames.length === 0) {
        playerSelect.innerHTML = '<option value="">-- Nessun Fantamanager --</option>';
      } else {
        playerSelect.innerHTML = playerNames.map(name => 
          `<option value="${name}">${name}</option>`
        ).join('');
      }

      const tbody = document.getElementById('league-table-body');
      if (playerNames.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="color: var(--text-muted);">Nessun fantamanager inserito. Usa il box a sinistra per aggiungere i tuoi amici.</td></tr>';
        return;
      }

      tbody.innerHTML = playerNames.map(name => {
        const p = leagueData.players[name];
        const rosterHTML = p.roster.map(r => `<span class="roster-item">${r}</span>`).join(' ') || '<em>Nessun acquisto</em>';
        return `
          <tr>
            <td><strong>${name}</strong></td>
            <td><span class="badge-credits">${p.budget} M$</span></td>
            <td class="roster-list">${rosterHTML}</td>
          </tr>
        `;
      }).join('');
    }

    render();
  </script>
</body>
</html>
